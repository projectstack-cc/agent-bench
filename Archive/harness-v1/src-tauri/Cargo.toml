[package]
name = "agent-harness"
version = "0.1.0"
description = "Agent Harness — Tauri Desktop IDE for the Zer0Flaw agent team"
authors = ["Zer0Flaw"]
edition = "2021"
rust-version = "1.77.2"
default-run = "agent-harness"

[lib]
name = "agent_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-harness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
