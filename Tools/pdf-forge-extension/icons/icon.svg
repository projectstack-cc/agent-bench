<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PDF Forge: an anvil with sparks flying upward">
  <!-- Anvil-and-sparks mark. Canonical source for the extension icon;
       rasterize to 16/48/128 px PNG for the CWS listing (manifest icons
       require bitmap formats). -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe5f0"/>
      <stop offset="0.55" stop-color="#aeb8cc"/>
      <stop offset="1" stop-color="#7c89a4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d33"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Sparks rising from the anvil face -->
  <g stroke-linecap="round">
    <line x1="46" y1="48" x2="40" y2="32" stroke="#ffd166" stroke-width="4"/>
    <line x1="58" y1="50" x2="56" y2="28" stroke="#ffb347" stroke-width="4"/>
    <line x1="70" y1="50" x2="75" y2="27" stroke="#ff9d3c" stroke-width="4"/>
    <line x1="82" y1="48" x2="90" y2="36" stroke="#ff7a45" stroke-width="4"/>
    <circle cx="39" cy="27" r="2.6" fill="#ffe29a"/>
    <circle cx="55.5" cy="23" r="2.2" fill="#ffc978"/>
    <circle cx="77" cy="22" r="2.4" fill="#ffb066"/>
    <circle cx="93" cy="31" r="2"  fill="#ff905c"/>
    <circle cx="64" cy="20" r="1.6" fill="#ffd166"/>
  </g>

  <!-- Anvil -->
  <!-- Top face plate -->
  <rect x="30" y="56" width="70" height="10" rx="3" fill="url(#steel)"/>
  <!-- Horn -->
  <path d="M31 58 C23 53 12 53.5 5 59.5 C12 64.5 22 66 31 64 Z" fill="#93a0b8"/>
  <!-- Body neck -->
  <path d="M52 66 L79 66 L73 81 L58 81 Z" fill="url(#steel)"/>
  <!-- Pedestal step -->
  <rect x="57" y="81" width="17" height="6" fill="#8b97ae"/>
  <!-- Base -->
  <path d="M41 87 L91 87 L99 96 L33 96 Z" fill="url(#steel)"/>

  <!-- Hot gleam where the sparks land -->
  <rect x="30" y="56" width="70" height="2.5" rx="1.25" fill="#ffcf7a" opacity="0.85"/>
</svg>
