<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; font: 13px/1.5 system-ui, sans-serif; color: #1a1a2e; background: #fafafa; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid #e5e5ea; display: flex; align-items: baseline; gap: 8px; }
  h1 { font-size: 15px; margin: 0; }
  .tagline { font-size: 11px; color: #777; }
  main { padding: 14px 16px; }
  #drop { border: 2px dashed #b9b9c9; border-radius: 10px; padding: 26px 12px; text-align: center; color: #666; transition: all .15s; cursor: pointer; }
  #drop.hover { border-color: #5b5bd6; background: #f0f0ff; color: #444; }
  #status { min-height: 20px; margin-top: 10px; font-size: 12px; }
  .ok { color: #1a7f37; } .err { color: #c62828; }
  footer { padding: 10px 16px; border-top: 1px solid #e5e5ea; font-size: 11px; color: #999; display: flex; justify-content: space-between; align-items: center; }
  footer span.lock { color: #555; }
</style>
</head>
<body>
<header><h1>ForgeMark</h1><span class="tagline">local · private · yours</span></header>
<main>
  <div id="drop">Drop a PDF here<br>or click to choose a file</div>
  <div id="status"></div>
  <input id="file" type="file" accept="application/pdf" hidden>
</main>
<footer>
  <span>Nothing is uploaded. Ever.</span>
  <span class="lock">🔒 Free · Pro coming soon</span>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
